name: Shipping demo CI with Docker

on:
  push:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test shipping rules in Docker
        run: docker build --target test -f Dockerfile .

      - name: Build runnable image
        run: |
          docker build \
            --build-arg "APP_VERSION=${GITHUB_SHA}" \
            -t shipping-demo:ci \
            -f Dockerfile .

      - name: Smoke test the running container
        run: |
          docker run -d --name shipping-demo-ci -p 8088:10000 shipping-demo:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8088/health.php >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --show-error http://localhost:8088/health.php
          curl --fail --silent --show-error 'http://localhost:8088/api/quote.php?subtotal=450000&area=inner' | grep -q '"shipping_fee":20000'

      - name: Stop smoke test container
        if: always()
        run: docker rm -f shipping-demo-ci || true
